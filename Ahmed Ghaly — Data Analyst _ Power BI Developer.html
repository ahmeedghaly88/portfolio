.glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

.lift{transition:transform .25s,border-color .25s,box-shadow .25s}

.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.8rem 1.35rem;border-radius:.75rem;font-weight:600;transition:transform .2s,background .2s,border-color .2s}
.btn:hover{transform:translateY(-2px)}
.btn-p{background:linear-gradient(120deg,var(--cy),var(--bl));color:#031018}
.btn-g{border:1px solid var(--line);background:var(--panel)}.btn-g:hover{border-color:var(--cy)}
a:focus-visible,button:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.hero-in>*{animation:rise .8s both}.hero-in>*:nth-child(2){animation-delay:.12s}.hero-in>*:nth-child(3){animation-delay:.24s}.hero-in>*:nth-child(4){animation-delay:.36s}
.bar{transform-origin:bottom;animation:grow .9s .4s both cubic-bezier(.2,.8,.2,1)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.lift{position:relative;background-image:radial-gradient(260px circle at var(--mx,-999px) var(--my,-999px),rgba(34,211,238,.13),transparent 70%)}
.aurora{position:absolute;border-radius:9999px;filter:blur(90px);pointer-events:none;z-index:-1}
.gtext{background:linear-gradient(100deg,#fff 20%,#8fe9fb 60%,#6ea8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.js .rv:not(.in){opacity:0;transform:translateY(26px)}.rv{transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
@keyframes float{50%{transform:translateY(-10px)}}@keyframes drift{50%{transform:translate(30px,-20px)}}
@keyframes marq{to{transform:translateX(-50%)}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.flt{animation:float 6s ease-in-out infinite}.marq{animation:marq 28s linear infinite}
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);transition:opacity .9s,visibility .9s}
.splash.out{opacity:0;visibility:hidden}
.ring{stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1.8s .3s forwards ease-out}
.navlink[aria-current=true]{color:var(--cy)!important;background:rgba(34,211,238,.1)}
h1,h2,h3{letter-spacing:-.02em;line-height:1.08;margin:0}

document.documentElement.classList.add("js");
addEventListener("mousemove",e=>{const c=e.target.closest&&e.target.closest(".lift");if(c){const r=c.getBoundingClientRect();c.style.setProperty("--mx",e.clientX-r.left+"px");c.style.setProperty("--my",e.clientY-r.top+"px")}});
setTimeout(()=>{const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.08});document.querySelectorAll(".rv").forEach(el=>io.observe(el));setTimeout(()=>document.querySelectorAll(".rv").forEach(el=>el.classList.add("in")),6000)},100);
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
